<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <title>Login - Student Management System</title>
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="../../css/account.css">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0&display=swap"
      rel="stylesheet"
    />
  </head>

  
  <body class="login-page">
    <h1 id="student-management__header"><span>Student Management System</span></h1>
    <h3 id="student-management__welcome-message">Welcome Back</h3>

    <div id="form__div-login">
      <form action="" id="form__login">
        <label for="form__login-email">Email</label>
        <input
          type="text"
          placeholder="someone@gmail.com"
          id="form__login-email"
        /> <br>

        <label for="form__login-password">Password</label>
        <input type="password" id="form__login-password" />

        <button>Login</button>
      </form>

      <a href="#">Forgot Password?</a> <br>
      <a href="">Sign up</a>
    </div>
  </body>
</html>
